services:
  # ─────────────────────────────────────────────
  # Backend — Node.js Express API
  # ─────────────────────────────────────────────
  - type: web
    name: insta-clone-backend
    runtime: node
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: FRONTEND_URL
        sync: false   # e.g. https://insta-clone-frontend.onrender.com

  # ─────────────────────────────────────────────
  # Frontend — React + Vite Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: insta-clone-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false   # e.g. https://insta-clone-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
